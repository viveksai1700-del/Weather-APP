<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>Weather App</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weatherResult" class="weather-result">

            <h2 id="cityName">Search for a city</h2>

            <p id="dateTime"></p>

            <div class="weather-icon" id="weatherIcon">
                <span id="weatherSymbol">--</span>
            </div>

            <div class="temperature-section">
                 <h3 id="temperature">--°C</h3>

                 <div class="unit-toggle">
                      <button id="celsiusBtn" onclick="setUnit('C')">°C</button>
                      <button id="fahrenheitBtn" onclick="setUnit('F')">°F</button>
                 </div>
            </div>

            <p id="description">
                Weather information will appear here
            </p>

            <div class="weather-details">

                <div class="detail">
                    <span>Humidity</span>
                    <p id="humidity">--%</p>
                </div>

                <div class="detail">
                    <span>Wind Speed</span>
                    <p id="wind">-- km/h</p>
                </div>

                <div class="detail">
                    <span>Feels Like</span>
                    <p id="feelsLike">--°C</p>
                </div>

            </div>

        </div>

        <p id="loadingMessage"></p>

        <p id="errorMessage"></p>
        <div class="recent-searches">
            <h3>Recent Searches</h3>
            <ul id="recentCities"></ul>
        </div>

         <footer>
            <p>Weather App</p>
            <span>Built with HTML, CSS and JavaScript</span>
         </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
